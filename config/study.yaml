# =============================================================================
# CardioAI Phase 2 — global study settings (Mayo Clinic Platform Discover)
# Study ID: CA-AGENTS-VAL-PHASE2  — 5 agent-validation cohorts
# (Women's CVD cohort and the 5 risk calculators are OUT OF SCOPE for this build)
# =============================================================================
study_id: CA-AGENTS-VAL-PHASE2
seed: 20261012

# --- Where the data lives inside the MCP workspace -------------------------
# Confirm these names in the MCP Schema Visualizer at onboarding.  Spark SQL
# accepts catalog.schema.table; leave catalog empty if not used.
# MCP provisions the data in BigQuery and the workspace queries it with the BigQuery client (MCP, 2026-10-28), so
# each schema is a BigQuery dataset: "`<project>`.<dataset>" (backticks because MCP project ids contain hyphens).
# CONFIRM the project and dataset names in the workspace (scripts/discover_schema.py lists them). The MCP OMOP ETL
# guide names the warehouse dataset `mcp` (FACT_*, DIM_*) and the OMOP delivery dataset OMOP_v6_1.
bq_project: null       # project the BigQuery client bills queries to (null = the workspace default)
schemas:
  cdm: omop            # OMOP CDM clinical tables (person, measurement, ...)          e.g. "`<project>`.OMOP_v6_1"
  vocab: omop          # OMOP vocabulary tables (concept, concept_ancestor, ...)     usually the same dataset as cdm
  work: cardioai_work  # project dataset with write access (MCP confirmed 2026-10-28) e.g. "`<project>`.cardioai_work"
  modality: modality   # MCP FACT_ / DIM_ tables (ECG waveforms, echo, radiology)     e.g. "`<project>`.mcp"

# --- Study calendar --------------------------------------------------------
# Retrospective window. Index events must fall inside; follow-up uses data
# through the MCP data-refresh date (set data_cutoff to the snapshot date).
index_start: '2012-01-01'
index_end:   '2023-12-31'
data_cutoff: '2025-12-31'
min_age: 18
min_prior_observation_days: 365   # lookback needed so "absence of code" = "no history"

# --- Sites ------------------------------------------------------------------
# Deck target: 12 sites (CAD: 8).  On MCP a "site" is defined from
# CARE_SITE / LOCATION.  site_map assigns care_site -> analysis site; anything
# unmapped is grouped by LOCATION.state.  Edit after running
# scripts/discover_schema.py, which lists care sites with patient counts.
site_definition: location_state_then_care_site
site_map: {}            # e.g. {12345: "Rochester-MN", 23456: "Phoenix-AZ"}
min_patients_per_site: 25

# --- Export / disclosure control (data stays "behind glass") ---------------
# Only aggregate tables leave the workspace; cells < small_cell are suppressed.
small_cell: 11
export_dir: exports

# --- Unit harmonisation for MEASUREMENT values ------------------------------
# OMOP unit concept ids: 8582 cm, 9330 inch, 9529 kg, 8739 lb.  Values whose
# unit_source_value matches are converted; everything is range-checked.
unit_conversions:
  height: [{unit_concept_id: 9330, unit_source_like: ['in', 'inch%', '[in_i]'], factor: 2.54}]
  weight: [{unit_concept_id: 8739, unit_source_like: ['lb%', '[lb_av]'], factor: 0.45359237}]
  weight_series: [{unit_concept_id: 8739, unit_source_like: ['lb%', '[lb_av]'], factor: 0.45359237}]

# --- Study plan: sample sizes + success rule (decision of 2026-10-12) --------
# A = enlarge CAD / Risk / Longitudinal, keep the deck rule (lower 95% CI >= deck goal)
# B = deck sizes, margin rule (lower 95% CI >= Phase 1 - margin)
# C = moderate enlargement + margin rule
# Under the margin rule the deck goal is still reported as a point-estimate target.
# Endpoints without a Phase 1 value, and "<=" endpoints (MAE, time), keep the deck goal.
plan: C
margins:            # non-inferiority margin vs Phase 1, by metric
  proportion: 0.05  # sensitivity, specificity, accuracy, PPV, NPV, alert sensitivity
  auc: 0.05
  pearson: 0.05
  kappa: 0.05
  f1_macro: 0.05
  c_index: 0.05
plans:
  A:
    rule: goal
    sizes:
      cad: {target_n: 2200, quotas: {ICA: 2000, CCTA: 200}}
      risk: {target_n: 2000, quotas: {all: 2000}}
      longitudinal: {target_n: 4000, quotas: {all: 4000}}
  B:
    rule: margin
    sizes: {}
  C:
    rule: margin
    sizes:
      cad: {target_n: 1300, quotas: {ICA: 1200, CCTA: 100}}
      risk: {target_n: 1500, quotas: {all: 1500}}
      longitudinal: {target_n: 2000, quotas: {all: 2000}}

# ---------------------------------------------------------------------------
# Model lock: what this validation runs with. The app's
# app/validated_agents/registry.yaml must carry the same values, so production
# serves exactly what was validated.
model_lock:
  encoders_fingerprint: 4f55f1444d7ad13556e7d320334f56b6c873971dbda656ace1d1a8159f73213b   # cardioai_mcp/encoders == app preprocessing
  app_repo: cardioailive1/cardioaimedconnect
