# =============================================================================
# Echocardiography External Validation Cohort — CA-AGENTS-VAL-PHASE2-ECHO
# Agent under test: Echo agent = EchoNet-Dynamic LV segmentation (MobileNetV3-UNet 3D, Vertex `mobilenetv3`)
#   -> per-frame area-length volumes -> median per-beat EF (echo branch, echo_pipeline.py v2.0.0)
#   Phase 1 trained on EchoNet-Dynamic (Stanford, 10,000 pts)
# Wall-motion extension = MobileNetV3-WM (echo_wm_training/), trained on Mayo echo in MCP (A4C + A2C + A3C):
#   17 AHA segment scores -> LAD / RCA / LCx territories (regional, CAD mapping) and LVEF estimate, global
#   hypokinesis, WMSI (global, heart-failure assessment). Its endpoints are an INTERNAL held-out validation:
#   this cohort's patients are excluded from its training (echo_wm_training/config.yaml exclude_persons_table =
#   echo_analytic_locked), so LOCK THIS COHORT BEFORE TRAINING the wall-motion model.
# Deck: 1,500 patients · 12 sites · 27 elements (19 REQ / 8 OPT) · 86.6% avg completeness
# =============================================================================
key: echo
study_id: CA-AGENTS-VAL-PHASE2-ECHO
title: Echocardiography External Validation Cohort
agent: echo_agent
phase1_source: EchoNet-Dynamic (Stanford University) — 10,000 patients
target_n: 1500
target_sites: 12
expected: {total_elements: 27, required: 19, avg_completeness: 86.6}

calendar: {}

index:
  description: "adult TTE in study window with a same-day expert LVEF on the echo report"
  one_per_person: earliest
  keep_columns: [lvef_ref, index_visit_concept_id]
  sql: |
    WITH tte AS (
      SELECT po.person_id, CAST(po.procedure_date AS DATE) AS index_date,
             COALESCE(v.care_site_id, p.care_site_id) AS care_site_id,
             v.visit_concept_id AS index_visit_concept_id
      FROM {{cdm}}.procedure_occurrence po
      JOIN {{cdm}}.person p ON p.person_id = po.person_id
      LEFT JOIN {{cdm}}.visit_occurrence v ON v.visit_occurrence_id = po.visit_occurrence_id
      WHERE (po.procedure_concept_id IN {{cs:tte}} OR po.procedure_source_concept_id IN {{cs:tte}})
        AND po.procedure_date BETWEEN CAST('{{index_start}}' AS DATE) AND CAST('{{index_end}}' AS DATE)
        AND YEAR(po.procedure_date) - p.year_of_birth >= {{min_age}}
    ),
    ef AS (
      SELECT t.person_id, t.index_date, m.value_as_number AS lvef_ref,
             ROW_NUMBER() OVER (PARTITION BY t.person_id, t.index_date
                                ORDER BY ABS(DATEDIFF(m.measurement_date, t.index_date))) AS rn
      FROM tte t JOIN {{cdm}}.measurement m ON m.person_id = t.person_id
      WHERE (m.measurement_concept_id IN {{cs:lvef}} OR m.measurement_source_concept_id IN {{cs:lvef}})
        AND DATEDIFF(m.measurement_date, t.index_date) BETWEEN 0 AND 1
        AND m.value_as_number BETWEEN 5 AND 90
    )
    SELECT t.person_id, t.index_date, MAX(t.care_site_id) AS care_site_id,
           MAX(t.index_visit_concept_id) AS index_visit_concept_id, MAX(ef.lvef_ref) AS lvef_ref
    FROM tte t LEFT JOIN ef ON ef.person_id = t.person_id AND ef.index_date = t.index_date AND ef.rn = 1
    GROUP BY t.person_id, t.index_date

exclusions:
  - name: "no expert-measured LVEF on the echo report (reference standard missing)"
    where: "c.lvef_ref IS NULL"
  - name: "LVAD or heart transplant before index (device/graft artefact)"
    where: |
      EXISTS (SELECT 1 FROM {{cdm}}.condition_occurrence x WHERE x.person_id = c.person_id AND x.condition_start_date <= c.index_date
              AND (x.condition_concept_id IN {{cs:lvad_transplant}} OR x.condition_source_concept_id IN {{cs:lvad_transplant}}))
      OR EXISTS (SELECT 1 FROM {{cdm}}.observation x WHERE x.person_id = c.person_id AND x.observation_date <= c.index_date
              AND (x.observation_concept_id IN {{cs:lvad_transplant}} OR x.observation_source_concept_id IN {{cs:lvad_transplant}}))
  - name: "< 365 days of observation before index"
    where: |
      NOT EXISTS (SELECT 1 FROM {{cdm}}.observation_period op WHERE op.person_id = c.person_id
                  AND op.observation_period_start_date <= DATE_SUB(c.index_date, {{min_prior_observation_days}})
                  AND op.observation_period_end_date >= c.index_date)

# EF-stratified sampling so correlation / MAE / agreement are estimated across the
# whole EF range (EchoNet-Dynamic is skewed to normal EF).  Weights restore prevalence.
sampling:
  method: "EF-stratified (quota) random sampling"
  strata_expr: |
    CASE WHEN e.lvef_ref < 30 THEN 'ef_lt30' WHEN e.lvef_ref < 40 THEN 'ef_30_39'
         WHEN e.lvef_ref < 50 THEN 'ef_40_49' WHEN e.lvef_ref < 70 THEN 'ef_50_69' ELSE 'ef_ge70' END
  quotas: {ef_lt30: 250, ef_30_39: 250, ef_40_49: 250, ef_50_69: 600, ef_ge70: 150}

elements:
  # ---------------- DEMOGRAPHICS (6)
  - {name: age, domain: demographics, description: Patient age at time of echo, required: true, expected_completeness: 1.00, src: {type: person, field: age}}
  - {name: gender, domain: demographics, description: Male / Female, required: true, expected_completeness: 1.00, src: {type: person, field: gender}}
  - {name: race, domain: demographics, description: Race / ethnicity, required: true, expected_completeness: 0.95, src: {type: person, field: race}}
  - {name: bmi, domain: demographics, description: Body mass index, required: true, expected_completeness: 0.90,
     src: {type: measurement, set: bmi, window: [-365, 30], range: [10, 90]}, fill: "weight / POWER(height / 100.0, 2)"}
  - {name: height, domain: demographics, description: Height in cm, required: true, expected_completeness: 0.95,
     src: {type: measurement, set: height, window: [-1095, 30], range: [120, 230]}}
  - {name: weight, domain: demographics, description: Weight in kg, required: true, expected_completeness: 0.95,
     src: {type: measurement, set: weight, window: [-90, 30], range: [25, 300]}}
  # ---------------- CLINICAL HISTORY (6)
  - {name: prior_mi, domain: clinical_history, description: History of myocardial infarction, required: true, expected_completeness: 0.95, src: {type: flag, set: mi_any, window: [-36500, 0]}}
  - {name: heart_failure, domain: clinical_history, description: Heart failure diagnosis, required: true, expected_completeness: 0.95, src: {type: flag, set: heart_failure, window: [-36500, 0]}}
  - {name: hypertension, domain: clinical_history, description: Hypertension diagnosis, required: true, expected_completeness: 0.95, src: {type: flag, set: hypertension, window: [-36500, 0]}}
  - {name: diabetes, domain: clinical_history, description: Diabetes mellitus, required: true, expected_completeness: 0.95, src: {type: flag, set: diabetes, window: [-36500, 0]}}
  - {name: cad, domain: clinical_history, description: Coronary artery disease, required: true, expected_completeness: 0.95, src: {type: flag, set: cad, window: [-36500, 0]}}
  - {name: valvular_disease, domain: clinical_history, description: Valvular heart disease, required: true, expected_completeness: 0.90, src: {type: flag, set: valvular_disease, window: [-36500, 0]}}
  # ---------------- LABORATORY (3)
  - {name: bnp, domain: laboratory, description: B-type natriuretic peptide, required: false, expected_completeness: 0.60, src: {type: measurement, set: bnp, window: [-30, 7], range: [1, 50000]}}
  - {name: troponin, domain: laboratory, description: Troponin level, required: false, expected_completeness: 0.50, src: {type: measurement, set: troponin, window: [-7, 7], range: [0, 100000]}}
  - {name: creatinine, domain: laboratory, description: Serum creatinine, required: false, expected_completeness: 0.80, src: {type: measurement, set: creatinine, window: [-90, 7], range: [0.2, 20]}}
  # ---------------- helper: echo report text (MCP de-identified notes) — aux, not a deck element
  - {name: echo_report, aux: true, src: {type: modality, modality: echo, column: report_text, window: [0, 1],
                                          fallback: {type: note_text, note: echo_report_title, window: [0, 1], max_chars: 8000}}}
  # ---------------- IMAGING (10)
  - {name: lvef_expert, domain: imaging, role: reference, description: LV ejection fraction — expert measured, required: true, expected_completeness: 0.98,
     src: {type: index_col, col: lvef_ref}}
  - {name: wall_motion, domain: imaging, role: reference, description: Wall motion assessment, required: true, expected_completeness: 0.95,
     src: {type: derived, expr: "NULLIF(REGEXP_EXTRACT(echo_report, '(normal (regional )?wall motion|no regional wall motion abnormalit[a-z]*|regional wall motion abnormalit[a-z]*|[a-z]*kines[a-z]*)', 1), '')"},
     transform: "CASE WHEN echo_report IS NULL THEN NULL WHEN {v} IS NULL THEN NULL WHEN {v} RLIKE '(^normal|^no regional)' THEN 'normal' ELSE 'abnormal' END"}
  - {name: lv_end_diastolic_volume, domain: imaging, description: LV end-diastolic volume, required: true, expected_completeness: 0.90,
     src: {type: measurement, set: lv_edv, window: [0, 1], range: [20, 500]}}
  - {name: lv_end_systolic_volume, domain: imaging, description: LV end-systolic volume, required: true, expected_completeness: 0.90,
     src: {type: measurement, set: lv_esv, window: [0, 1], range: [5, 450]}}
  - {name: la_diameter, domain: imaging, description: Left atrial diameter (cm), required: true, expected_completeness: 0.85,
     src: {type: measurement, set: la_diam, window: [0, 1], range: [1, 90]}, transform: "CASE WHEN {v} > 10 THEN {v} / 10.0 ELSE {v} END"}
  - {name: la_volume, domain: imaging, description: Left atrial volume, required: false, expected_completeness: 0.70,
     src: {type: measurement, set: la_vol, window: [0, 1], range: [10, 400]}}
  - {name: rv_function, domain: imaging, description: RV systolic function, required: false, expected_completeness: 0.75,
     src: {type: derived, expr: "NULLIF(REGEXP_EXTRACT(echo_report, 'right ventricular (systolic )?function (is |appears )?([a-z ]{4,40})', 3), '')"},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN {v} RLIKE '(mild|moderat|sever|reduc|decreas|depress|abnormal)' THEN 'reduced' WHEN {v} RLIKE 'normal' THEN 'normal' ELSE 'indeterminate' END"}
  - {name: diastolic_function, domain: imaging, description: Diastolic function grade, required: false, expected_completeness: 0.65,
     src: {type: derived, expr: "NULLIF(REGEXP_EXTRACT(echo_report, '(grade (iii|ii|i|[1-3]) (left ventricular )?diastolic dysfunction|normal (left ventricular )?diastolic function|indeterminate diastolic function)', 1), '')"},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN {v} RLIKE 'grade (iii|3)' THEN 'grade_3' WHEN {v} RLIKE 'grade (ii|2)' THEN 'grade_2' WHEN {v} RLIKE 'grade (i|1)' THEN 'grade_1' WHEN {v} RLIKE '^normal' THEN 'normal' ELSE 'indeterminate' END"}
  - {name: valve_regurgitation, domain: imaging, description: Valve regurgitation severity, required: false, expected_completeness: 0.80,
     src: {type: derived, expr: "NULLIF(REGEXP_EXTRACT(echo_report, '((no|trace|trivial|mild|moderate|severe)[a-z -]{0,25} (mitral|aortic|tricuspid|pulmonic) (valve )?regurgitation)', 1), '')"},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN {v} RLIKE 'severe' THEN 'severe' WHEN {v} RLIKE 'moderate' THEN 'moderate' ELSE 'none_mild' END"}
  - {name: valve_stenosis, domain: imaging, description: Valve stenosis severity, required: false, expected_completeness: 0.75,
     src: {type: derived, expr: "NULLIF(REGEXP_EXTRACT(echo_report, '((no|mild|moderate|severe|critical)[a-z -]{0,25} (aortic|mitral) (valve )?stenosis)', 1), '')"},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN {v} RLIKE '(severe|critical)' THEN 'severe' WHEN {v} RLIKE 'moderate' THEN 'moderate' WHEN {v} RLIKE '^no' THEN 'none' ELSE 'mild' END"}
  # ---------------- OUTCOME / STUDY DATA (2)
  - {name: clinical_indication, domain: outcome, description: Clinical indication for echo, required: true, expected_completeness: 0.90,
     src: {type: derived, expr: "COALESCE(NULLIF(REGEXP_EXTRACT(echo_report, 'indications?:[ ]*([^.;]{3,120})', 1), ''), CASE index_visit_concept_id WHEN 9201 THEN 'inpatient' WHEN 262 THEN 'inpatient' WHEN 9203 THEN 'emergency' WHEN 9202 THEN 'outpatient' END)"}}
  - {name: image_quality, domain: outcome, description: Overall image quality rating, required: true, expected_completeness: 0.95,
     src: {type: modality, modality: echo, column: image_quality, window: [0, 1], fallback: {type: empty}},
     fill: "CASE WHEN echo_report IS NULL THEN NULL WHEN echo_report RLIKE '(technically (difficult|limited)|suboptimal|poor (acoustic|image|echo) (window|quality)|limited (study|views|windows|image))' THEN 'limited' ELSE 'adequate' END"}
  # ---------------- reference-standard helpers (aux) used by the endpoints
  # wall-motion reference: the echo report parsed by echo_wm_training.labels (audited: annotation/LABEL_AUDIT.md)
  - {name: ref_wma, aux: true, src: {type: modality, modality: echo_wm, table: reference_table, column: ref_wall_motion, window: [0, 1], fallback: {type: empty}}}
  - {name: ref_terr_lad, aux: true, src: {type: modality, modality: echo_wm, table: reference_table, column: terr_lad, window: [0, 1], fallback: {type: empty}},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN CAST({v} AS DOUBLE) >= 1 THEN 'abnormal' ELSE 'normal' END"}
  - {name: ref_terr_rca, aux: true, src: {type: modality, modality: echo_wm, table: reference_table, column: terr_rca, window: [0, 1], fallback: {type: empty}},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN CAST({v} AS DOUBLE) >= 1 THEN 'abnormal' ELSE 'normal' END"}
  - {name: ref_terr_lcx, aux: true, src: {type: modality, modality: echo_wm, table: reference_table, column: terr_lcx, window: [0, 1], fallback: {type: empty}},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN CAST({v} AS DOUBLE) >= 1 THEN 'abnormal' ELSE 'normal' END"}
  - {name: ref_global_hypokinesis, aux: true, src: {type: modality, modality: echo_wm, table: reference_table, column: global_hypokinesis, window: [0, 1], fallback: {type: empty}},
     transform: "CASE WHEN {v} IS NULL THEN NULL WHEN CAST({v} AS DOUBLE) >= 1 THEN 'abnormal' ELSE 'normal' END"}
  - {name: ref_wmsi, aux: true, src: {type: modality, modality: echo_wm, table: reference_table, column: wmsi, window: [0, 1], fallback: {type: empty}}}
  - {name: ref_ef_category, aux: true, src: {type: derived, expr: "CASE WHEN lvef_expert IS NULL THEN NULL WHEN lvef_expert <= 40 THEN 'reduced' WHEN lvef_expert < 50 THEN 'mildly_reduced' ELSE 'normal' END"}}
  - {name: bsa, aux: true, src: {type: derived, expr: "SQRT(height * weight / 3600.0)"}}
  - {name: ref_lv_size, aux: true, src: {type: derived, expr: "CASE WHEN lv_end_diastolic_volume IS NULL OR bsa IS NULL THEN NULL WHEN lv_end_diastolic_volume / bsa > CASE WHEN gender = 'Male' THEN 74 ELSE 61 END THEN 'dilated' ELSE 'normal' END"}}

# Agent output contract (agent runs inside the MCP workspace on the A4C cine for each index echo).
# Run the SAME pipeline the Vertex container serves (echo branch: echo_pipeline.run) on the DICOM:
# it crops/resizes to 112x112, resamples to 50 fps, segments with training-style 16-frame clips and
# reports the median EF over detected beats. Clips shorter than ~1.5 s cannot be scored.
predictions:
  table: echo_predictions
  columns:
    agent_lvef: "predicted LVEF (%) = summary.ef"
    agent_ef_category: "reduced | mildly_reduced | normal  (<=40, 41-49, >=50)"
    agent_edv_ml: "summary.edv_ml (NULL unless the DICOM carries PhysicalDeltaX; single-plane A4C area-length)"
    agent_esv_ml: "summary.esv_ml"
    agent_lv_size: "derived by evaluate(): agent_edv_ml / bsa > 74 (men) / 61 (women) mL/m2 -> dilated (same rule as ref_lv_size)"
    runtime_s: "wall-clock seconds from DICOM load to output"
    pipeline_version: "summary.pipeline_version (must equal the locked version)"
    # wall-motion model (echo_wm_training.runtime.pipeline on the A4C, A2C and A3C cines of the same echo)
    agent_wall_motion: "abnormal | normal = flags.wma_any"
    agent_terr_lad: "abnormal | normal = flags.terr_lad (NULL when no LAD segment was assessed)"
    agent_terr_rca: "abnormal | normal = flags.terr_rca"
    agent_terr_lcx: "abnormal | normal = flags.terr_lcx"
    agent_global_hypokinesis: "abnormal | normal = flags.global_hypokinesis"
    agent_wmsi: "findings.wmsi (mean score over assessed segments)"
    agent_wm_lvef: "findings.lvef_pct (wall-motion model estimate; the primary EF stays agent_lvef)"
    agent_wm_views: "views used (findings.views)"
    wm_runtime_fingerprint: "must equal the locked wall-motion runtime fingerprint"
  known_limitations:
    - "EchoNet segments the LV only; wall motion comes from the Mayo-trained wall-motion model (internal validation, patients of this cohort never trained it). Segments of a view that was not acquired are not assessed, and a territory with no assessed segment is NULL (excluded, counted)."
    - "Wall-motion reference = the echo report read by echo_wm_training.labels (one reader per study, as reported); hedged reports are excluded. Territory is the AHA standard assignment, not angiography."
    - "Agent EDV is single-plane (A4C) area-length; the reference EDV is usually biplane Simpson. Expect a systematic offset; report Bland-Altman for EDV alongside the chamber-size kappa."
    - "Phase 1 EF values (r 0.96, MAE 3.2, kappa 0.91) are not supported by the training repo, which reports only Dice on one traced frame. Replace them with evaluate_echonet_ef.py output (EchoNet TEST split) before the validation lock; under Plan C the pass threshold depends on them."

endpoints:
  primary:
    - {id: ef_correlation, label: "EF correlation (Pearson r)", metric: pearson, pred: agent_lvef, ref: lvef_expert, goal: 0.90, direction: ge, phase1: 0.96}
    - {id: ef_mae, label: "EF mean absolute error (EF points)", metric: mae, pred: agent_lvef, ref: lvef_expert, goal: 5.0, direction: le, phase1: 3.2}
    - {id: clinical_agreement, label: "Clinical agreement — EF category (Cohen's kappa)", metric: kappa, pred: agent_ef_category, ref: ref_ef_category, goal: 0.85, direction: ge, phase1: 0.91}
  secondary:
    - {id: chamber_size, label: "Chamber size agreement (kappa)", metric: kappa, pred: agent_lv_size, ref: ref_lv_size, goal: 0.80, direction: ge, phase1: 0.84}
    - {id: processing_time, label: "Processing time (median s)", metric: median, pred: runtime_s, goal: 60, direction: le, phase1: 45}
    - {id: data_completeness, label: "Data completeness (required elements)", metric: completeness, goal: 0.95, direction: ge, phase1: 0.98}
    # wall-motion extension (deck goals 0.85 for any abnormality; territory / global goals for the clinical lead to set)
    - {id: wall_motion_sens, label: "Wall motion abnormality — sensitivity", metric: sensitivity, pred: agent_wall_motion, ref: ref_wma, positive: abnormal, goal: 0.85, direction: ge, phase1: null}
    - {id: wall_motion_spec, label: "Wall motion abnormality — specificity", metric: specificity, pred: agent_wall_motion, ref: ref_wma, positive: abnormal, goal: 0.85, direction: ge, phase1: null}
    - {id: lad_territory_sens, label: "LAD-territory abnormality — sensitivity", metric: sensitivity, pred: agent_terr_lad, ref: ref_terr_lad, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: lad_territory_spec, label: "LAD-territory abnormality — specificity", metric: specificity, pred: agent_terr_lad, ref: ref_terr_lad, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: rca_territory_sens, label: "RCA-territory abnormality — sensitivity", metric: sensitivity, pred: agent_terr_rca, ref: ref_terr_rca, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: rca_territory_spec, label: "RCA-territory abnormality — specificity", metric: specificity, pred: agent_terr_rca, ref: ref_terr_rca, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: lcx_territory_sens, label: "LCx-territory abnormality — sensitivity", metric: sensitivity, pred: agent_terr_lcx, ref: ref_terr_lcx, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: lcx_territory_spec, label: "LCx-territory abnormality — specificity", metric: specificity, pred: agent_terr_lcx, ref: ref_terr_lcx, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: global_hypokinesis_sens, label: "Global hypokinesis — sensitivity", metric: sensitivity, pred: agent_global_hypokinesis, ref: ref_global_hypokinesis, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: global_hypokinesis_spec, label: "Global hypokinesis — specificity", metric: specificity, pred: agent_global_hypokinesis, ref: ref_global_hypokinesis, positive: abnormal, goal: null, direction: ge, phase1: null}
    - {id: wmsi_mae, label: "Wall motion score index MAE vs report", metric: mae, pred: agent_wmsi, ref: ref_wmsi, goal: null, direction: le, phase1: null}
  subgroups: [gender, age_group, race, site, image_quality, ref_ef_category]
