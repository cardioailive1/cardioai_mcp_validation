# =============================================================================
# MCP modality tables (ECG waveforms, echocardiography DICOM / reports)
# -----------------------------------------------------------------------------
# Mayo Clinic Platform exposes structured EHR in OMOP CDM, plus physiologic
# waveforms, imaging and de-identified notes.  The physical table names for the
# waveform / imaging indices are platform-specific and are NOT public, so they
# are isolated here.  At onboarding:
#   1. run  python scripts/discover_schema.py --engine spark   (lists every
#      table/column matching ecg|ekg|waveform|echo|dicom|study|series)
#   2. confirm names in the MCP Schema Visualizer
#   3. fill the `table` / `columns` below.  Nothing else in the code changes.
# Until filled, the builder falls back to pure-OMOP proxies (procedure codes,
# LOINC measurements and NOTE text) and marks modality columns as NULL.
# =============================================================================
ecg:
  enabled: false                       # set true once mapped
  table: "{modality}.ecg_index"        # PLACEHOLDER
  columns:
    person_id: person_id
    ecg_id: ecg_id
    acquisition_datetime: acquisition_datetime
    waveform_uri: waveform_path        # the waveform column: a Base64 string (MCP) or a file path (see waveform_storage)
    sample_rate_hz: sample_rate
    n_leads: lead_count
    read_statement: diagnosis_statement   # confirmed (over-read) interpretation text
    is_confirmed: confirmed_flag          # cardiologist over-read flag
    vent_rate: ventricular_rate
    pr_interval: pr_interval
    qrs_duration: qrs_duration
    qt_interval: qt_interval
    qtc_interval: qtc_interval
    qrs_axis: r_axis
  # MCP (Adam Resnick, 2026-10-14): the ECG waveform table stores each waveform as a Base64-encoded string.
  # base64 -> ecg_training.extract_waveforms decodes them once into .npz files for training;
  # file   -> the column holds a path (MUSE XML / WFDB / .npz).
  waveform_storage: base64
  # Only used if the Base64 holds raw samples (no XML / gzip / npz / JSON inside): CONFIRM on real rows
  # with `python -m ecg_training.probe_waveforms` before extraction.
  waveform_raw: {dtype: "<i2", units_per_bit: 4.88, units: uV, layout: auto}
  requirements:            # agent input spec (MobileNetV3-1D; any rate, 8 or 12 leads, >= 9.5 s)
    n_leads: 12
    duration_s: 10
    resample_to_hz: 500

echo:
  enabled: false
  study_table: "{modality}.echo_study"     # PLACEHOLDER — one row per echo exam
  columns:
    person_id: person_id
    study_id: study_uid
    study_datetime: study_datetime
    dicom_uri: dicom_path
    has_a4c_cine: a4c_available           # apical-4-chamber cine present (EchoNet-Dynamic input)
    image_quality: image_quality
    report_text: report_text
  # MCP (2026-10-14): echo notes are in FACT_ECHO_TEST.ECHO_NOTE. CONFIRM the schema prefix and the
  # join columns in the workspace (and the Resource Hub training); the echo DICOM location is still to confirm.
  note_table: "{modality}.FACT_ECHO_TEST"
  note_column: ECHO_NOTE
  measurement_table: "{modality}.echo_measurement"   # PLACEHOLDER — structured echo report values
  measurement_columns:
    study_id: study_uid
    name: measurement_name
    value: measurement_value
    unit: measurement_unit
  requirements:           # agent input spec (EchoNet-Dynamic–trained model; echo_pipeline v2.0.0)
    view: A4C
    mode: greyscale B-mode   # colour Doppler cines are refused
    min_seconds: 1.5         # first/last 0.3 s cannot sit at the supervised centre of a 16-frame, period-2 clip
    resize_px: 112           # done by the pipeline (crop to ultrasound region, pad square, resize)
    fps: 50                  # done by the pipeline (resampling)
    pixel_spacing: DICOM SequenceOfUltrasoundRegions.PhysicalDeltaX (needed for EDV / chamber size)
  # Wall-motion model (echo_wm_training/): echo DICOM requested from the radiology inventory like CMR
  # (echo_wm_training.mcp_echo). CONFIRM with MCP how a FACT_ECHO_TEST row links to its DICOM study.
  mcp:
    schema: "{modality}"                       # CONFIRM the schema holding the FACT_ tables
    echo_test_table: FACT_ECHO_TEST
    echo_test_columns:                         # CONFIRM column names in the workspace
      note: ECHO_NOTE
      datetime: ECHO_TEST_DTM
      link: ACCESSION_NBR                      # key shared with the inventory (accession number or study UID)
      patient_dk: PATIENT_DK
    inventory_table: FACT_RADIOLOGY_DICOM_INVENTORY
    inventory_link: DICOM_ACCESSION_NUMBER     # inventory column matching echo_test_columns.link
    person_map: {table: null, clinic_number_column: PATIENT_CLINIC_NUMBER, person_id_column: person_id}
    deid_ok: [Ready, Available]
  wm_requirements:        # wall-motion model input spec (echo_wm_training runtime 1.0.0)
    views: [A4C, A2C, A3C]   # at least one; all three for all 17 AHA segments
    mode: greyscale B-mode
    min_seconds: 1.6         # 32 frames at 20 fps (at least one heartbeat)
    resize_px: 112
    fps: 20

# Echo wall-motion tables built in the workspace (echo_wm_training): the delivered studies, and the
# report-derived wall-motion reference the Phase 2 echo cohort reads (config/cohorts/echo.yaml, modality echo_wm).
echo_wm:
  enabled: false                       # set true once echo_wm_reference is built
  table: "{work}.echo_wm_study"        # mcp_echo.build_study_table (training manifest source)
  reference_table: "{work}.echo_wm_reference"   # mcp_echo.reference_table
  columns:
    person_id: person_id
    study_id: study_uid
    study_datetime: study_datetime
    dicom_uri: dicom_path
    report_text: report_text
    ref_wall_motion: ref_wall_motion   # normal | abnormal (any segment abnormal, regional or global)
    wma_any: wma_any
    terr_lad: terr_lad
    terr_rca: terr_rca
    terr_lcx: terr_lcx
    global_hypokinesis: global_hypokinesis
    wmsi: wmsi

mri:
  enabled: false
  table: "{work}.cmr_study"            # built by mri_training.mcp_imaging.build_study_table (one row per CMR study)
  columns:
    person_id: person_id
    study_id: study_uid
    study_datetime: study_datetime
    dicom_uri: dicom_path               # folder of the study's de-identified DICOM (as delivered) or a zip
    report_text: report_text            # final signed CMR report (else the NOTE fall-back below)
  # MCP radiology tables ("Radiology" slides, MCP Resource Hub; Adam Resnick 2026-10-15). DICOM pixel data are
  # NOT in a table: instances are inventoried in FACT_RADIOLOGY_DICOM_INVENTORY and must be REQUESTED for
  # de-identification (IMAGE_DEID_STATUS Ready or Available). mri_training.mcp_imaging builds the request
  # (short-axis LGE + cine series only) and, once delivered, the `table` above (cmr_study) from them.
  # Joins: FACT_RADIOLOGY.ACCESSION_NBR = INVENTORY.DICOM_ACCESSION_NUMBER;
  #        INVENTORY <-> FACT_IMAGINGSTUDY on STMO_NAME_IN_ADL + MODALITY + STUDY_INSTANCE_UID.
  # OMOP: CMR procedures are in procedure_occurrence (CPT), reports also in note.note_text; the inventory is not in OMOP.
  mcp:
    schema: "{modality}"                       # CONFIRM the schema holding the FACT_ tables
    report_table: FACT_RADIOLOGY               # RADIOLOGY_REPORT, RADIOLOGY_IMPRESSION, RADIOLOGY_DTM, ACCESSION_NBR,
                                               # SERVICE_MODALITY_CODE, SERVICE_RESULT_STATUS
    inventory_table: FACT_RADIOLOGY_DICOM_INVENTORY
    study_table: FACT_IMAGINGSTUDY             # PROCEDURE_CODE_TEXT, PROCEDURE_CODE_CODING_CODE, STUDY_DESCRIPTION, MODALITY_1..
    cmr_cpt: ["75557", "75559", "75561", "75563", "75565"]
    cmr_description_regex: '(?i)(cardiac|heart|myocard|cmr|mr[ ]?heart|mri[ ]?heart)'
    final_report_status_regex: '(?i)(final|verified|signed|complete)'   # SERVICE_RESULT_STATUS values to keep (CONFIRM)
    # Patient key: the inventory and FACT_IMAGINGSTUDY carry PATIENT_CLINIC_NUMBER; OMOP uses person_id.
    # CONFIRM with MCP how they map (a crosswalk table, or the same value) and fill this in:
    person_map: {table: null, clinic_number_column: PATIENT_CLINIC_NUMBER, person_id_column: person_id}
    deid_ok: [Ready, Available]
    # De-identification request (MCP TSM, 2026-10-15): a CSV of the selected studies with STUDY_INSTANCE_UID,
    # PATIENT_DK, MODALITY, STMO_NAME_IN_ADL (mcp_imaging.deid_request). PATIENT_DK is read from this column
    # (r = FACT_RADIOLOGY, s = FACT_IMAGINGSTUDY); CONFIRM which table carries it in the workspace.
    patient_dk_source: r.PATIENT_DK
  requirements:            # MRI agent input spec (mri_training/, runtime 1.0.0)
    sequences: [LGE short axis (required), cine SSFP short axis (for LVEF)]
    min_slices: 3
    pixel_mm: 1.25         # done by the pipeline (resample, 240 mm field of view)

# NOTE table conventions used for NLP fall-backs (OMOP NOTE / NOTE_NLP).
# Titles are matched case-insensitively with these regexes.
notes:
  echo_report_title: '(?i)(echo|echocardiogra|tte)'
  ecg_report_title: '(?i)(ecg|ekg|electrocardiogra)'
  cath_report_title: '(?i)(cath|angiogra|coronary)'
  ccta_report_title: '(?i)(ccta|coronary ct|cardiac ct)'
  stress_report_title: '(?i)(stress|treadmill|exercise test|nuclear)'
  hf_note_title: '(?i)(cardio|heart failure|progress|discharge)'
  hp_note_title: '(?i)(history and physical|h&p|admission|consult|cardiology|progress)'
  cmr_report_title: '(?i)(cardiac mri|cardiac mr[^a-z]|cmr|cardiac magnetic|mri heart|mr heart)'
