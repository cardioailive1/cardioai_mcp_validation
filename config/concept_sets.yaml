# =============================================================================
# CardioAI Phase 2 — OMOP concept sets for Mayo Clinic Platform (MCP) Discover
# -----------------------------------------------------------------------------
# Each concept set is resolved AT RUNTIME against the OMOP vocabulary tables in
# the MCP workspace (CONCEPT, CONCEPT_RELATIONSHIP, CONCEPT_ANCESTOR):
#   1. codes are matched in CONCEPT on (vocabulary_id, concept_code); a trailing
#      '%' means "prefix match" (ICD10CM I21% = every I21.x code)
#   2. non-standard codes (ICD10CM, ICD9CM, HCPCS ...) are mapped to standard
#      concepts via CONCEPT_RELATIONSHIP 'Maps to'
#   3. if descendants: true, all descendants via CONCEPT_ANCESTOR are added
#   4. name_like entries are a fallback search on concept_name inside a domain;
#      they are flagged review: true and MUST be reviewed in Athena / the MCP
#      Schema Visualizer before database lock (see scripts/export_concept_sets.py)
# Resolving at runtime (instead of hard-coding concept_ids) keeps the sets
# correct for whatever OMOP vocabulary release MCP has loaded.
# =============================================================================

